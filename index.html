<script>

window.addEventListener("load",()=>{

    setTimeout(()=>{

        document.getElementById("loader").classList.add("hide");

    },1600);

});

document.getElementById("openShop").addEventListener("click",function(e){

    e.preventDefault();

    const loader=document.getElementById("loader");

    loader.classList.remove("hide");

    setTimeout(()=>{

location.assign("shop.html");

},1400);

});
window.addEventListener("pageshow", () => {
    const track = document.querySelector(".gallery-track");

    track.style.animation = "none";
    track.offsetHeight; // принудительная перерисовка
    track.style.animation = "galleryMoveMobile 125s linear infinite";

    if (window.innerWidth > 768) {
        track.style.animation = "galleryMove 125s linear infinite";
    }
});
