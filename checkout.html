<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Оформлення замовлення | GOTTI21SV</title>

<link rel="stylesheet" href="checkout.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="checkout-page">

<a href="javascript:history.back()" class="back">←</a>

<img
src="52917A0C-CBA4-4183-887A-F77A10ECA24C.png"
class="logo"
alt="GOTTI21SV">

<h1>

Оформлення замовлення

</h1>

<div class="product-card">

<img
id="productImage"
src=""
alt="">

<div class="product-info">

<h2 id="productName"></h2>

<p id="productPrice"></p>

</div>

</div>

<form id="checkoutForm">

    <div class="section-title">
        РОЗМІР
    </div>

    <div class="sizes">

        <button type="button" class="size active">S</button>
        <button type="button" class="size">M</button>
        <button type="button" class="size">L</button>
        <button type="button" class="size">XL</button>

    </div>

    <div class="section-title">
        ЗВ'ЯЗОК
    </div>

    <div class="contact-switch">

        <button type="button" class="contact-btn">
            INSTAGRAM
        </button>

        <button type="button" class="contact-btn active">
            TELEGRAM
        </button>

    </div>

    <input
        id="contact"
        type="text"
        class="input"
        placeholder="@username">

    <div class="section-title">
        ДОСТАВКА
    </div>

    <input
        id="name"
        type="text"
        class="input"
        placeholder="Ім'я, прізвище"
        required>

    <input
        id="city"
        type="text"
        class="input"
        placeholder="Місто"
        required>

    <input
        id="phone"
        type="tel"
        class="input"
        placeholder="Номер телефону"
        required>

    <input
        id="department"
        type="text"
        class="input"
        placeholder="Номер відділення Нової Пошти"
        required>


    <button class="submit" type="submit">
<div class="section-title">

ОБЕРІТЬ СПОСІБ ОПЛАТИ

</div>

<div class="payment-buttons">

<button
type="button"
class="pay-btn active"
data-type="full">

Повна оплата

</button>

<button
type="button"
class="pay-btn"
data-type="deposit">

Передоплата 500 UAH

</button>

</div>
        ОПЛАТИТИ
<div
id="afterPayment"
style="display:none;">

<p class="payment-info">

Після успішної оплати натисніть кнопку нижче для відправки даних.

</p>

<button
id="sendOrder"
class="submit success-button">

ВІДПРАВИТИ ДАНІ ДЛЯ ВІДПРАВКИ

</button>

</div>
    </button>

</form>
</div>

<script>

const params = new URLSearchParams(window.location.search);

const product = decodeURIComponent(params.get("product") || "");
const price = decodeURIComponent(params.get("price") || "");
const image = decodeURIComponent(params.get("image") || "");
if(!product || !price || !image){

alert("Помилка відкриття товару.");

history.back();

throw new Error("Missing product data");

}

document.getElementById("productName").textContent = product;
document.getElementById("productPrice").textContent = price;
document.getElementById("productImage").src = image;
document.getElementById("productImage").loading="eager";
/* ---------- SIZE ---------- */

let selectedSize = "S";

document.querySelectorAll(".size").forEach(btn=>{

btn.addEventListener("click",()=>{

document.querySelectorAll(".size").forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

selectedSize=btn.textContent;

});

});

/* ---------- CONTACT ---------- */

let contactType="Telegram";

document.querySelectorAll(".contact-btn").forEach(btn=>{

btn.addEventListener("click",()=>{

document.querySelectorAll(".contact-btn").forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

contactType=btn.textContent;

});

});

/* ---------- SEND ORDER ---------- */

document.getElementById("checkoutForm").addEventListener("submit",async(e)=>{

e.preventDefault();

const order={

product,

price,

image,

size:selectedSize,

contactType,

contact:document.getElementById("contact").value.trim(),

name:document.getElementById("name").value.trim(),

city:document.getElementById("city").value.trim(),

phone:document.getElementById("phone").value.trim(),

department:document.getElementById("department").value.trim(),

comment:document.getElementById("comment").value.trim()

};

sessionStorage.setItem("order", JSON.stringify(order));

sessionStorage.setItem("paid","false");

window.open(
    "https://send.monobank.ua/jar/AVRkCP9whs",
    "_blank"
);

const sendButton = document.querySelector(".submit");

sendButton.textContent = "ВІДПРАВИТИ ДАНІ ДЛЯ ВІДПРАВКИ";

sendButton.style.background = "#16A34A";

sendButton.type = "button";

sendButton.onclick = () => {

const payment = "Повна оплата";

const text = `🛒 НОВЕ ЗАМОВЛЕННЯ

👕 Товар:
${product}

💰 Ціна:
${price}

📏 Розмір:
${selectedSize}

💳 Оплата:
${payment}

👤 Ім'я:
${document.getElementById("name").value}

📱 Телефон:
${document.getElementById("phone").value}

🏙 Місто:
${document.getElementById("city").value}

📦 Нова Пошта:
${document.getElementById("department").value}

💬 ${contactType}:
${document.getElementById("contact").value}

📝 Коментар:
${document.getElementById("comment").value}

✅ ОПЛАТА ПРОВЕДЕНА`;

window.open(
`https://t.me/gotti21svv?text=${encodeURIComponent(text)}`,
"_blank"
);

};

});

</script>

</body>
</html>
