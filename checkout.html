<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

<title>Оформлення замовлення | GOTTI21SV</title>

<link rel="stylesheet" href="checkout.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="checkout-page">

<div class="checkout-header">

<a href="javascript:history.back()" class="back" aria-label="Назад">

<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

<path
d="M14.5 5.5L8.5 12L14.5 18.5"
fill="none"
stroke="currentColor"
stroke-width="1.8"
stroke-linecap="round"
stroke-linejoin="round"/>

</svg>

</a>

<h1>ОФОРМЛЕННЯ ЗАМОВЛЕННЯ</h1>

</div>

<div class="product-card">

<img
id="productImage"
src=""
alt="">

<div class="product-info">

<h2 id="productName"></h2>

<p id="productPrice"></p>

</div>

</div>

<form id="checkoutForm">

    <div class="section-title">
        РОЗМІР
    </div>

    <div class="sizes">

        <button type="button" class="size active">S</button>
        <button type="button" class="size">M</button>
        <button type="button" class="size">L</button>
        <button type="button" class="size">XL</button>

    </div>

    <div class="section-title">
        ЗВ'ЯЗОК
    </div>

    <div class="contact-switch">

        <button type="button" class="contact-btn">
            INSTAGRAM
        </button>

        <button type="button" class="contact-btn active">
            TELEGRAM
        </button>

    </div>

    <input
        id="contact"
        type="text"
        class="input"
        placeholder="@username">

    <div class="section-title">
        ДОСТАВКА
    </div>

    <input
        id="name"
        type="text"
        class="input"
        placeholder="Ім'я, прізвище"
        required>

    <input
        id="city"
        type="text"
        class="input"
        placeholder="Місто"
        required>

    <input
        id="phone"
        type="tel"
        class="input"
        placeholder="Номер телефону"
        required>

    <input
        id="department"
        type="text"
        class="input"
        placeholder="Номер відділення Нової Пошти"
        required>


<div class="section-title">

ОБЕРІТЬ СПОСІБ ОПЛАТИ

</div>

<div class="payment-buttons">

<button
type="button"
class="pay-btn active"
data-type="full">

Повна оплата

</button>

<button
type="button"
class="pay-btn"
data-type="deposit">

Передоплата 500 UAH

</button>

</div>

<button
class="submit pay-main"
type="submit">

ОПЛАТИТИ

</button>

<div
id="afterPayment"
style="display:none;">
<div id="orderSummary">

    <p><strong>👤 Ім'я</strong><br>
    <span id="summaryName"></span></p>

    <p><strong>🏙 Місто</strong><br>
    <span id="summaryCity"></span></p>

    <p><strong>📱 Телефон</strong><br>
    <span id="summaryPhone"></span></p>

    <p><strong>📦 Нова Пошта</strong><br>
    <span id="summaryDepartment"></span></p>

    <p><strong>💬 Зв'язок</strong><br>
    <span id="summaryContact"></span></p>

    <p><strong>💳 Оплата</strong><br>
    <span id="summaryPayment"></span></p>

</div>
<p class="payment-info">

Після успішної оплати натисніть кнопку нижче для відправки даних.

</p>

<button
id="sendOrder"
class="submit success-button"
type="button">

ВІДПРАВИТИ ДАНІ ДЛЯ ВІДПРАВКИ

</button>

</div>

</form>
</div>

<script>

const params = new URLSearchParams(window.location.search);

const product = decodeURIComponent(params.get("product") || "");
const price = decodeURIComponent(params.get("price") || "");
const image = decodeURIComponent(params.get("image") || "");
if(!product || !price || !image){

alert("Помилка відкриття товару.");

history.back();

throw new Error("Missing product data");

}

const currency = localStorage.getItem("currency") || "UAH";

/* ---------- CHANGE LANGUAGE ---------- */

if(currency==="EUR"){

document.querySelector(".section-title:nth-of-type(1)").textContent="SIZE";

document.querySelector(".section-title:nth-of-type(2)").textContent="CONTACT";

document.querySelector(".section-title:nth-of-type(3)").textContent="SHIPPING";

document.querySelector(".section-title:nth-of-type(4)").textContent="PAYMENT";

document.querySelector(".pay-btn[data-type='full']").textContent="Full payment";

document.querySelector(".pay-btn[data-type='deposit']").textContent="Deposit €10";

document.querySelector(".pay-main").textContent="PAY";

document.querySelector(".payment-info").textContent=
"After successful payment, tap the button below to send your order.";

document.getElementById("sendOrder").textContent=
"SEND ORDER";

document.getElementById("name").placeholder="Full name";

document.getElementById("city").placeholder="City";

document.getElementById("phone").placeholder="Phone number";

document.getElementById("department").placeholder="Address / Delivery";

}

document.getElementById("productPrice").textContent = price;
document.getElementById("productImage").src = image;
document.getElementById("productImage").loading="eager";
/* ---------- SIZE ---------- */

let selectedSize = "S";

document.querySelectorAll(".size").forEach(btn=>{

btn.addEventListener("click",()=>{

document.querySelectorAll(".size").forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

selectedSize=btn.textContent;

});

});

/* ---------- CONTACT ---------- */

let contactType="Telegram";

document.querySelectorAll(".contact-btn").forEach(btn=>{

btn.addEventListener("click",()=>{

document.querySelectorAll(".contact-btn").forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

contactType=btn.textContent;

});

});
/* ---------- PAYMENT TYPE ---------- */

const currency = localStorage.getItem("currency") || "UAH";

let paymentType =
currency==="EUR"
? "Full payment"
: "Повна оплата";

document.querySelectorAll(".pay-btn").forEach(btn=>{

btn.addEventListener("click",()=>{

document.querySelectorAll(".pay-btn").forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

if(currency==="EUR"){

paymentType = btn.dataset.type==="deposit"

? "Deposit €10"

: "Full payment";

}else{

paymentType = btn.dataset.type==="deposit"

? "Передоплата 500 UAH"

: "Повна оплата";

}

});

});

/* ---------- SEND ORDER ---------- */

document.getElementById("checkoutForm").addEventListener("submit",async(e)=>{

e.preventDefault();

const order={

product,

price,

image,

size:selectedSize,

contactType,

contact:document.getElementById("contact").value.trim(),

name:document.getElementById("name").value.trim(),

city:document.getElementById("city").value.trim(),

phone:document.getElementById("phone").value.trim(),

department:document.getElementById("department").value.trim(),

};

sessionStorage.setItem("order", JSON.stringify(order));

sessionStorage.setItem("paid","true");

window.open(
"https://send.monobank.ua/jar/AVRkCP9whs",
"_blank"
);

document.querySelector(".sizes").style.display = "none";
document.querySelector(".contact-switch").style.display = "none";

document.querySelectorAll(".section-title")[0].style.display = "none";
document.querySelectorAll(".section-title")[1].style.display = "none";
document.querySelectorAll(".section-title")[2].style.display = "none";
document.querySelectorAll(".section-title")[3].style.display = "none";

document.querySelector(".payment-buttons").style.display = "none";
document.querySelector(".pay-main").style.display = "none";

document.getElementById("afterPayment").style.display = "block";
document.getElementById("contact").style.display = "none";
document.getElementById("name").style.display = "none";
document.getElementById("city").style.display = "none";
document.getElementById("phone").style.display = "none";
document.getElementById("department").style.display = "none";
document.getElementById("summaryName").textContent =
document.getElementById("name").value;

document.getElementById("summaryCity").textContent =
document.getElementById("city").value;

document.getElementById("summaryPhone").textContent =
document.getElementById("phone").value;

document.getElementById("summaryDepartment").textContent =
document.getElementById("department").value;

document.getElementById("summaryContact").textContent =
contactType + ": " + document.getElementById("contact").value;

document.getElementById("summaryPayment").textContent =
paymentType;

});
document.getElementById("sendOrder").addEventListener("click", () => {

const text = currency==="EUR"

? `🛒 NEW ORDER

👕 Product:
${product}

💰 Price:
${price}

📏 Size:
${selectedSize}

💳 Payment:
${paymentType}

👤 Name:
${document.getElementById("name").value}

📱 Phone:
${document.getElementById("phone").value}

🏙 City:
${document.getElementById("city").value}

📦 Address:
${document.getElementById("department").value}

💬 ${contactType}:
${document.getElementById("contact").value}

✅ PAID`

: `🛒 НОВЕ ЗАМОВЛЕННЯ

👕 Товар:
${product}

💰 Ціна:
${price}

📏 Розмір:
${selectedSize}

💳 Оплата:
${paymentType}

👤 Ім'я:
${document.getElementById("name").value}

📱 Телефон:
${document.getElementById("phone").value}

🏙 Місто:
${document.getElementById("city").value}

📦 Нова Пошта:
${document.getElementById("department").value}

💬 ${contactType}:
${document.getElementById("contact").value}

✅ ОПЛАТА ПРОВЕДЕНА`;

window.open(
`https://t.me/gotti21svv?text=${encodeURIComponent(text)}`,
"_blank"
);

});

</script>

</body>
</html>
